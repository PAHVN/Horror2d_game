<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Horror 2D Multiplayer v0.9a</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; color:#fff; }
  #game { position:fixed; inset:0; display:block; }

  /* ============ START SCREEN ============ */
  #startScreen {
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(ellipse at center, #1a0505 0%, #000 80%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px;
  }
  #startScreen.hidden { display:none; }

  #startTitle {
    font-size:38px; font-weight:bold;
    color:#cc2222; text-shadow:0 0 20px #ff0000, 3px 3px 6px #000;
    letter-spacing:3px; margin-bottom:8px;
    animation:pulseTitle 2s infinite alternate;
  }
  @keyframes pulseTitle {
    from { text-shadow:0 0 15px #ff0000, 3px 3px 6px #000; }
    to   { text-shadow:0 0 30px #ff0000, 3px 3px 6px #000; }
  }

  #startSubtitle {
    font-size:13px; color:#aa8888; letter-spacing:2px;
    margin-bottom:20px; text-align:center;
  }

  #nameInput {
    padding:12px 16px; margin-bottom:16px;
    background:rgba(30,10,10,0.8); color:#fff;
    border:2px solid #662222; border-radius:8px;
    font-size:16px; width:220px; text-align:center;
    font-family:sans-serif;
    outline:none;
  }
  #nameInput:focus { border-color:#cc2222; }

  .startBtn {
    padding:16px 40px; margin:6px;
    background:rgba(80,20,20,0.8); color:#fff;
    border:2px solid #cc2222; border-radius:10px;
    font-size:18px; font-weight:bold; letter-spacing:2px;
    cursor:pointer; transition:all 0.2s;
    min-width:220px;
    font-family:sans-serif;
  }
  .startBtn:active { transform:scale(0.95); }
  .startBtn:hover { background:rgba(150,30,30,0.9); }
  .startBtn:disabled { opacity:0.4; cursor:not-allowed; }

  #audioToggle {
    position:absolute; top:15px; right:15px;
    padding:8px 14px; border-radius:8px;
    background:rgba(0,0,0,0.5); color:#fff;
    border:1px solid #666; font-size:14px;
    cursor:pointer; font-family:sans-serif;
  }

  #connStatus {
    margin-top:16px; font-size:13px;
    color:#888; letter-spacing:1px;
  }
  #connStatus.ok { color:#44dd44; }
  #connStatus.err { color:#ff4444; }

  /* ============ HUD ============ */
  #joyBase {
    position:fixed; left:20px; bottom:20px;
    width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.35);
    touch-action:none; z-index:10;
  }
  #joyKnob {
    position:absolute; left:50%; top:50%;
    width:50px; height:50px; border-radius:50%;
    background:rgba(255,255,255,0.6); border:2px solid #fff;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }

  #inventory {
    position:fixed; right:15px; bottom:15px;
    display:flex; gap:8px; z-index:10;
  }
  .invSlot {
    width:56px; height:56px; border-radius:8px;
    background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; color:#fff;
    transition:all 0.15s;
  }
  .invSlot.active {
    background:rgba(255,220,100,0.35);
    border-color:#ffdd66;
    box-shadow:0 0 12px rgba(255,220,100,0.7);
  }
  .invSlot.empty { display:none; }

  #hud {
    position:fixed; top:10px; left:10px; color:#fff;
    font-size:12px; text-shadow:1px 1px 2px #000; z-index:10;
    background:rgba(0,0,0,0.4); padding:6px 10px; border-radius:6px;
    line-height:1.4;
  }

  #playerCount {
    position:fixed; top:10px; left:50%;
    transform:translateX(-50%);
    color:#88ff88; font-size:14px; font-weight:bold;
    text-shadow:0 0 8px #00ff00, 1px 1px 2px #000;
    z-index:10; background:rgba(0,0,0,0.5);
    padding:6px 14px; border-radius:8px;
    letter-spacing:1px; font-family:monospace;
    border:1px solid rgba(100,255,100,0.3);
  }

  #powerAlert {
    position:fixed; top:52px; left:50%;
    transform:translateX(-50%);
    color:#ff4444; font-size:14px; font-weight:bold;
    text-shadow:0 0 8px #ff0000, 1px 1px 2px #000;
    z-index:10; display:none;
    letter-spacing:1px;
    background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:6px;
    animation:blink 0.8s infinite alternate;
  }
  #powerAlert.show { display:block; }
  @keyframes blink {
    from { opacity:1; }
    to { opacity:0.35; }
  }

  #pickupBtn {
    position:fixed; right:15px; top:50%;
    transform:translateY(-50%);
    padding:12px 18px; border-radius:8px;
    background:rgba(255,220,100,0.85); color:#000;
    font-weight:bold; font-size:14px;
    display:none; z-index:10;
    border:none;
  }
  #pickupBtn.show { display:block; }

  #doorBtn, #breakerBtn {
    position:fixed; z-index:10;
    padding:8px 14px; border-radius:6px;
    background:rgba(120,200,255,0.9); color:#000;
    font-weight:bold; font-size:13px;
    display:none; border:none;
    transform:translate(-50%,-140%);
    white-space:nowrap;
  }
  #doorBtn.show, #breakerBtn.show { display:block; }
  #breakerBtn { background:rgba(255,180,80,0.95); }

  #heartbeat {
    position:fixed; inset:0; pointer-events:none;
    z-index:40; display:none;
    box-shadow:inset 0 0 100px rgba(255,0,0,0.6), inset 0 0 200px rgba(255,0,0,0.3);
    animation:heartbeatPulse 0.6s infinite;
  }
  #heartbeat.show { display:block; }
  @keyframes heartbeatPulse {
    0%, 100% { opacity:0.3; }
    50%      { opacity:0.8; }
  }

  /* Thông báo player join/leave */
  #notify {
    position:fixed; bottom:100px; left:50%;
    transform:translateX(-50%);
    color:#fff; font-size:14px;
    background:rgba(0,0,0,0.7); padding:8px 16px;
    border-radius:8px; letter-spacing:1px;
    z-index:20; display:none;
    text-shadow:1px 1px 2px #000;
  }
  #notify.show { display:block; animation:notifyFade 2s forwards; }
  @keyframes notifyFade {
    0%   { opacity:0; transform:translate(-50%, 10px); }
    20%  { opacity:1; transform:translate(-50%, 0); }
    80%  { opacity:1; transform:translate(-50%, 0); }
    100% { opacity:0; transform:translate(-50%, -10px); }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">v0.9a <span id="myId"></span><br><span id="posInfo">...</span></div>
<div id="playerCount">👥 1</div>
<div id="powerAlert">⚠️ MẤT ĐIỆN</div>

<div id="joyBase"><div id="joyKnob"></div></div>
<div id="inventory">
  <div class="invSlot empty" data-slot="flashlight">🔦</div>
  <div class="invSlot empty" data-slot="key">🔑</div>
</div>
<button id="pickupBtn">NHẶT</button>
<button id="doorBtn">KHÓA</button>
<button id="breakerBtn">TẮT ĐIỆN</button>

<div id="heartbeat"></div>
<div id="notify"></div>

<div id="startScreen">
  <div id="startTitle">HORROR 2D</div>
  <div id="startSubtitle">MULTIPLAYER SURVIVAL</div>
  <input type="text" id="nameInput" placeholder="Tên của bạn" maxlength="12" value="Player">
  <button class="startBtn" id="btnStart" disabled>🔌 ĐANG KẾT NỐI...</button>
  <button id="audioToggle">🔊 ÂM THANH: BẬT</button>
  <div id="connStatus">Đang kết nối server...</div>
</div>

<script>
// ==================== CANVAS ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(devicePixelRatio, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

// ==================== GAME STATE ====================
const gameState = {
  started: false,
  myId: null,
  myName: 'Player',
  myPos: { x: 0, y: 0, dir: 0 },       // vị trí local (predict)
  serverPos: { x: 0, y: 0, dir: 0 },   // vị trí cuối từ server
  players: new Map(),                  // id -> { x, y, dir, name }
  connected: false,
  audioEnabled: true,
};

// ==================== SHARED STATE ====================
const sharedState = {
  doorLocked: false,
  breakerOn: true,
};

// ==================== WEBSOCKET CLIENT ====================
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
let ws = null;

function connectWS() {
  const connStatus = document.getElementById('connStatus');
  const btnStart = document.getElementById('btnStart');

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    connStatus.textContent = '❌ Không thể kết nối: ' + e.message;
    connStatus.className = 'err';
    return;
  }

  ws.onopen = () => {
    console.log('[WS] Connected to', WS_URL);
    gameState.connected = true;
    connStatus.textContent = '✅ Đã kết nối server';
    connStatus.className = 'ok';
    btnStart.disabled = false;
    btnStart.textContent = '▶ BẮT ĐẦU';
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleMessage(msg);
  };

  ws.onerror = (e) => {
    console.error('[WS] Error', e);
    connStatus.textContent = '❌ Lỗi kết nối';
    connStatus.className = 'err';
  };

  ws.onclose = () => {
    console.log('[WS] Disconnected');
    gameState.connected = false;
    connStatus.textContent = '⚠️ Mất kết nối — đang thử lại...';
    connStatus.className = 'err';
    btnStart.disabled = true;
    // Thử reconnect sau 2s
    setTimeout(connectWS, 2000);
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'welcome':
      gameState.myId = msg.id;
      gameState.myPos.x = msg.players[msg.id].x;
      gameState.myPos.y = msg.players[msg.id].y;
      gameState.myPos.dir = msg.players[msg.id].dir;
      gameState.serverPos.x = msg.players[msg.id].x;
      gameState.serverPos.y = msg.players[msg.id].y;
      gameState.serverPos.dir = msg.players[msg.id].dir;

// Load danh sách players (BỎ chính mình)
gameState.players.clear();
for (const [id, p] of Object.entries(msg.players)) {
  if (id === gameState.myId) continue;   // ← FIX: bỏ mình
  gameState.players.set(id, { x: p.x, y: p.y, dir: p.dir, name: p.name || id });
}
      // Load shared state
      sharedState.doorLocked = msg.state.doorLocked;
      sharedState.breakerOn = msg.state.breakerOn;

      document.getElementById('myId').textContent = '[' + msg.id + ']';
      updatePlayerCountUI();
      console.log('[WS] Welcome:', msg.id, msg.players);
      break;

case 'state':
  for (const [id, p] of Object.entries(msg.players)) {
    if (id === gameState.myId) {
      // Chỉ lưu server pos — KHÔNG thêm vào players Map
      gameState.serverPos.x = p.x;
      gameState.serverPos.y = p.y;
      gameState.serverPos.dir = p.dir;
    } else {
      const existing = gameState.players.get(id);
      if (existing) {
        existing.x = p.x;
        existing.y = p.y;
        existing.dir = p.dir;
        if (p.name) existing.name = p.name;
      } else {
        gameState.players.set(id, { x: p.x, y: p.y, dir: p.dir, name: p.name || id });
      }
    }
  }
  updatePlayerCountUI();
  break;

case 'playerJoined':
  if (msg.id === gameState.myId) break;   // ← FIX: bỏ mình
  gameState.players.set(msg.id, {
    x: msg.player.x, y: msg.player.y, dir: msg.player.dir,
    name: msg.player.name || msg.id,
  });
  updatePlayerCountUI();
  showNotify(`👋 ${msg.player.name || msg.id} đã vào`);
  break;

case 'playerLeft':
  if (msg.id === gameState.myId) break;
  gameState.players.delete(msg.id);
  updatePlayerCountUI();
  showNotify(`👋 ${msg.id} đã rời`);
  break;

    case 'doorState':
      sharedState.doorLocked = msg.locked;
      playDoorLock();
      break;

    case 'breakerState':
      sharedState.breakerOn = msg.on;
      if (msg.on) {
        power.flicker = 1 + Math.floor(Math.random() * 3);
        power.flickerTimer = 0;
        power.targetDim = 1.0;
        document.getElementById('powerAlert').classList.remove('show');
      } else {
        power.targetDim = 0;
        power.flicker = 0;
        document.getElementById('powerAlert').classList.add('show');
      }
      playBreaker();
      break;
  }
}

function sendWS(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

function updatePlayerCountUI() {
  const count = gameState.players.size + (gameState.myId ? 1 : 0);
  // players Map chỉ chứa remote, không chứa mình → +1 nếu mình đã join
  const total = gameState.myId ? gameState.players.size + 1 : gameState.players.size;
  document.getElementById('playerCount').textContent = '👥 ' + total;
}

let notifyTimer = null;
function showNotify(text) {
  const el = document.getElementById('notify');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ==================== AUDIO ====================
const audio = {
  ctx: null,
  masterGain: null,
  windOsc: null,
  windGain: null,
  heartbeatTimer: 0,
};

function initAudio() {
  if (audio.ctx) return;
  try {
    audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.masterGain = audio.ctx.createGain();
    audio.masterGain.gain.value = 0.3;
    audio.masterGain.connect(audio.ctx.destination);

    const windOsc = audio.ctx.createOscillator();
    windOsc.type = 'sine';
    windOsc.frequency.value = 60;
    const windGain = audio.ctx.createGain();
    windGain.gain.value = 0.08;
    windOsc.connect(windGain);
    windGain.connect(audio.masterGain);
    windOsc.start();

    audio.windOsc = windOsc;
    audio.windGain = windGain;
  } catch (e) {
    console.warn('Audio init failed:', e);
  }
}

function playBeep(freq, duration, type = 'sine', volume = 0.2) {
  if (!gameState.audioEnabled || !audio.ctx) return;
  try {
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audio.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audio.masterGain);
    osc.start();
    osc.stop(audio.ctx.currentTime + duration);
  } catch (e) {}
}

function playClick() { playBeep(1200, 0.05, 'square', 0.15); }
function playPickup() { playBeep(1500, 0.1, 'sine', 0.2); }
function playDoorLock() { playBeep(800, 0.08, 'square', 0.15); }
function playBreaker() { playBeep(600, 0.1, 'square', 0.2); }

// ==================== START/END SCREEN ====================
const startScreen = document.getElementById('startScreen');
const btnStart = document.getElementById('btnStart');
const audioToggle = document.getElementById('audioToggle');
const nameInput = document.getElementById('nameInput');

function startGame(e) {
  if (e) e.preventDefault();
  if (!gameState.connected) return;

  initAudio();
  if (audio.ctx && audio.ctx.state === 'suspended') {
    audio.ctx.resume();
  }

  gameState.myName = nameInput.value.trim() || 'Player';
  gameState.started = true;
  startScreen.classList.add('hidden');
}

btnStart.addEventListener('touchstart', startGame);
btnStart.addEventListener('click', startGame);

function toggleAudio(e) {
  e.preventDefault();
  gameState.audioEnabled = !gameState.audioEnabled;
  audioToggle.textContent = gameState.audioEnabled ? '🔊 ÂM THANH: BẬT' : '🔇 ÂM THANH: TẮT';
  if (audio.masterGain) {
    audio.masterGain.gain.value = gameState.audioEnabled ? 0.3 : 0;
  }
}
audioToggle.addEventListener('touchstart', toggleAudio);
audioToggle.addEventListener('click', toggleAudio);

// Power object (dùng cho hiệu ứng điện — sẽ sync sau)
const power = {
  flicker: 0,
  flickerTimer: 0,
  dimFactor: 1.0,
  targetDim: 1.0,
};

// Kết nối WS ngay khi load
connectWS();
// ==================== MAP ====================
const TILE = 32;
const MAP_W = 60;
const MAP_H = 50;
const WORLD_W = MAP_W * TILE;
const WORLD_H = MAP_H * TILE;

// -------- NHÀ --------
const HOUSE = {
  x: Math.floor(MAP_W / 2) - 5,
  y: Math.floor(MAP_H / 2) - 4,
  w: 10,
  h: 8,
};
const MID_Y = HOUSE.y + Math.floor(HOUSE.h / 2);
const DOOR_MID_X = HOUSE.x + 3;
const DOOR_MAIN_X = HOUSE.x + 6;

// -------- CHỒI (phía Nam) --------
const SHED = { w: 3, h: 3 };
let shedX = 0, shedY = 0;
{
  const gap = 5;
  const houseCx = HOUSE.x + HOUSE.w / 2;
  shedX = Math.round(houseCx - SHED.w / 2);
  shedY = HOUSE.y + HOUSE.h + gap;
  shedX = Math.max(2, Math.min(MAP_W - SHED.w - 2, shedX));
  shedY = Math.max(2, Math.min(MAP_H - SHED.h - 2, shedY));
}
const shedDoor = { gx: shedX + 1, gy: shedY };

const breaker = {
  gx: shedX + 1,
  gy: shedY + 1,
};

// -------- WALL --------
function isHouseWall(gx, gy) {
  if (gx < HOUSE.x || gx >= HOUSE.x + HOUSE.w) return false;
  if (gy < HOUSE.y || gy >= HOUSE.y + HOUSE.h) return false;
  const isLeft   = gx === HOUSE.x;
  const isRight  = gx === HOUSE.x + HOUSE.w - 1;
  const isTop    = gy === HOUSE.y;
  const isBottom = gy === HOUSE.y + HOUSE.h - 1;
  if (isLeft || isRight || isTop || isBottom) {
    if (isTop && gx === DOOR_MAIN_X) return false;
    return true;
  }
  if (gy === MID_Y) {
    if (gx === DOOR_MID_X) return sharedState.doorLocked;
    return true;
  }
  return false;
}

function isShedWall(gx, gy) {
  if (gx < shedX || gx >= shedX + SHED.w) return false;
  if (gy < shedY || gy >= shedY + SHED.h) return false;
  const isLeft   = gx === shedX;
  const isRight  = gx === shedX + SHED.w - 1;
  const isTop    = gy === shedY;
  const isBottom = gy === shedY + SHED.h - 1;
  if (isLeft || isRight || isTop || isBottom) {
    if (gx === shedDoor.gx && gy === shedDoor.gy) return false;
    return true;
  }
  return false;
}

function isWall(gx, gy) {
  return isHouseWall(gx, gy) || isShedWall(gx, gy);
}

function isFloor(gx, gy) {
  if (gx >= HOUSE.x && gx < HOUSE.x + HOUSE.w &&
      gy >= HOUSE.y && gy < HOUSE.y + HOUSE.h &&
      !isHouseWall(gx, gy)) return true;
  if (gx >= shedX && gx < shedX + SHED.w &&
      gy >= shedY && gy < shedY + SHED.h &&
      !isShedWall(gx, gy)) return true;
  return false;
}

function isInsideHouse(gx, gy) {
  return gx >= HOUSE.x && gx < HOUSE.x + HOUSE.w &&
         gy >= HOUSE.y && gy < HOUSE.y + HOUSE.h;
}

function isInsideShed(gx, gy) {
  return gx >= shedX && gx < shedX + SHED.w &&
         gy >= shedY && gy < shedY + SHED.h;
}

const furniture = [
  { gx: HOUSE.x + 4, gy: HOUSE.y + 2, gw: 3, gh: 1, type: 'table', solid: true },
  { gx: HOUSE.x + 3, gy: HOUSE.y + 2, gw: 1, gh: 1, type: 'chair', solid: true },
  { gx: HOUSE.x + 7, gy: HOUSE.y + 2, gw: 1, gh: 1, type: 'chair', solid: true },
  { gx: HOUSE.x + 6, gy: HOUSE.y + 6, gw: 2, gh: 1, type: 'table', solid: true },
];

function isFurniture(gx, gy) {
  for (const f of furniture) {
    if (!f.solid) continue;
    if (gx >= f.gx && gx < f.gx + f.gw &&
        gy >= f.gy && gy < f.gy + f.gh) return true;
  }
  return false;
}

const lights = [
  { x: (HOUSE.x + HOUSE.w / 2) * TILE,
    y: (HOUSE.y + MID_Y) / 2 * TILE + TILE / 2,
    radius: 180, intensity: 0.55 },
  { x: (HOUSE.x + HOUSE.w / 2) * TILE,
    y: (MID_Y + HOUSE.y + HOUSE.h) / 2 * TILE + TILE / 2,
    radius: 180, intensity: 0.55 },
];

// Items — mỗi client có bản riêng (v0.9a chưa sync)
const ITEMS = [
  {
    id: 'flashlight', icon: '🔦',
    x: (HOUSE.x + 5) * TILE + TILE / 2,
    y: (HOUSE.y + 2) * TILE + TILE / 2,
    picked: false, pickupRange: 1.3 * TILE,
    spawnX: (HOUSE.x + 5) * TILE + TILE / 2,
    spawnY: (HOUSE.y + 2) * TILE + TILE / 2,
  },
  {
    id: 'key', icon: '🔑',
    x: (HOUSE.x + 4) * TILE + TILE / 2,
    y: (HOUSE.y + 2) * TILE + TILE / 2,

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;
let joyId = null;
let joyStart = { x:0, y:0 };
let joyDelta = { x:0, y:0 };
const JOY_RADIUS = 45;

joyBase.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  if (joyActive) return;
  joyActive = true;
  joyId = t.identifier;
  joyStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive:false });

joyBase.addEventListener('touchmove', (e) => {
  if (!joyActive) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== joyId) continue;
    let dx = t.clientX - joyStart.x;
    let dy = t.clientY - joyStart.y;
    const len = Math.hypot(dx, dy);
    if (len > JOY_RADIUS) { dx = dx / len * JOY_RADIUS; dy = dy / len * JOY_RADIUS; }
    joyDelta.x = dx; joyDelta.y = dy;
    joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  e.preventDefault();
}, { passive:false });

function joyEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyActive = false; joyId = null;
      joyDelta.x = 0; joyDelta.y = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
  e.preventDefault();
}
joyBase.addEventListener('touchend', joyEnd, { passive:false });
joyBase.addEventListener('touchcancel', joyEnd, { passive:false });

// ==================== COLLISION ====================
function isBlocked(px, py, r) {
  const pts = [
    [px - r, py], [px + r, py], [px, py - r], [px, py + r],
    [px - r*0.7, py - r*0.7], [px + r*0.7, py - r*0.7],
    [px - r*0.7, py + r*0.7], [px + r*0.7, py + r*0.7],
  ];
  for (const [cx, cy] of pts) {
    const gx = Math.floor(cx / TILE), gy = Math.floor(cy / TILE);
    if (gx < 0 || gx >= MAP_W || gy < 0 || gy >= MAP_H) return true;
    if (isWall(gx, gy)) return true;
    if (isFurniture(gx, gy)) return true;
  }
  return false;
}

function moveLocalPlayer(dx, dy) {
  const r = player.r;
  const pos = gameState.myPos;
  if (!isBlocked(pos.x + dx, pos.y, r)) pos.x += dx;
  if (!isBlocked(pos.x, pos.y + dy, r)) pos.y += dy;
}

// ==================== SPAWN POSITION ====================
// Khi server gửi welcome → cập nhật myPos
// Nhưng có thể spawn trúng tường → tìm ô trống gần nhất
function findFreeSpot(px, py) {
  const gx0 = Math.floor(px / TILE);
  const gy0 = Math.floor(py / TILE);
  for (let r = 0; r < 15; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const gx = gx0 + dx, gy = gy0 + dy;
        if (gx < 0 || gx >= MAP_W || gy < 0 || gy >= MAP_H) continue;
        if (isWall(gx, gy) || isFurniture(gx, gy)) continue;
        return { x: gx * TILE + TILE / 2, y: gy * TILE + TILE / 2 };
      }
    }
  }
  return { x: px, y: py };
}

// ==================== NETWORK SYNC ====================
// Gửi input lên server mỗi 50ms (20 FPS)
let lastSentX = 0;
let lastSentY = 0;
let lastSentDir = 0;

setInterval(() => {
  if (!gameState.started || !gameState.connected) return;
  const pos = gameState.myPos;
  // Chỉ gửi khi có thay đổi (giảm bandwidth)
  if (Math.abs(pos.x - lastSentX) < 0.5 &&
      Math.abs(pos.y - lastSentY) < 0.5 &&
      Math.abs(pos.dir - lastSentDir) < 0.01) return;

  sendWS({
    type: 'input',
    x: pos.x,
    y: pos.y,
    dir: pos.dir,
    name: gameState.myName,
  });

  lastSentX = pos.x;
  lastSentY = pos.y;
  lastSentDir = pos.dir;
}, 50);

// ==================== UPDATE ====================
const posInfo = document.getElementById('posInfo');

function update(dt) {
  if (!gameState.started) return;

  const dtSec = dt / 1000;

  // Hiệu ứng điện (local — sync qua sharedState.breakerOn)
  if (!sharedState.breakerOn) {
    power.targetDim = 0;
  } else {
    power.targetDim = 1.0;
  }

  if (power.flicker > 0) {
    power.flickerTimer += dt;
    if (power.flickerTimer > 120) {
      power.flickerTimer = 0;
      power.flicker--;
      power.dimFactor = (power.dimFactor > 0.5) ? 0 : 1;
      if (power.flicker === 0) {
        power.dimFactor = 1;
        power.targetDim = 1;
      }
    }
  } else {
    const speed = 1.5;
    if (power.dimFactor < power.targetDim) {
      power.dimFactor = Math.min(power.targetDim, power.dimFactor + speed * dtSec);
    } else if (power.dimFactor > power.targetDim) {
      power.dimFactor = Math.max(power.targetDim, power.dimFactor - speed * dtSec);
    }
  }

  // Di chuyển local player (predict — mượt mà không chờ server)
  const jx = joyDelta.x / JOY_RADIUS;
  const jy = joyDelta.y / JOY_RADIUS;
  const len = Math.hypot(jx, jy);

  if (len > 0.15) {
    const nx = jx / Math.max(1, len);
    const ny = jy / Math.max(1, len);
    const move = player.speed * (dt / 16.67);
    moveLocalPlayer(nx * move, ny * move);
    gameState.myPos.dir = Math.atan2(ny, nx);
  }

  // ==== SMOOTH CORRECTION ====
  // Nếu server pos khác local pos đáng kể → kéo về từ từ
  const lerp = 0.15;
  const diffX = gameState.serverPos.x - gameState.myPos.x;
  const diffY = gameState.serverPos.y - gameState.myPos.y;
  const diffDist = Math.hypot(diffX, diffY);

  // Chỉ correct khi lệch > 30px (tránh jitter khi đi bình thường)
  if (diffDist > 30) {
    gameState.myPos.x += diffX * lerp;
    gameState.myPos.y += diffY * lerp;
  }

  // Remote players — smooth interpolation
  for (const [id, p] of gameState.players.entries()) {
    // p đã là vị trí server gửi, không cần lerp vì server update 20 FPS
    // Nhưng có thể thêm lerp nếu muốn mượt hơn
    // p.displayX = p.displayX + (p.x - p.displayX) * 0.3
    if (p.displayX === undefined) { p.displayX = p.x; p.displayY = p.y; }
    p.displayX += (p.x - p.displayX) * 0.3;
    p.displayY += (p.y - p.displayY) * 0.3;
  }

  // Camera theo local player
  camera.x += (gameState.myPos.x - camera.x) * 0.15;
  camera.y += (gameState.myPos.y - camera.y) * 0.15;
  const halfW = W / 2, halfH = H / 2;
  if (WORLD_W > W) camera.x = Math.max(halfW, Math.min(WORLD_W - halfW, camera.x));
  else camera.x = WORLD_W / 2;
  if (WORLD_H > H) camera.y = Math.max(halfH, Math.min(WORLD_H - halfH, camera.y));
  else camera.y = WORLD_H / 2;

  // Item gần nhất
  nearestItem = null;
  let bestDist = Infinity;
  for (const it of ITEMS) {
    if (it.picked) continue;
    const d = Math.hypot(it.x - gameState.myPos.x, it.y - gameState.myPos.y);
    if (d < it.pickupRange && d < bestDist) {
      bestDist = d;
      nearestItem = it;
    }
  }
  if (nearestItem) pickupBtn.classList.add('show');
  else pickupBtn.classList.remove('show');

  // Cửa
  const doorCX = DOOR_MID_X * TILE + TILE / 2;
  const doorCY = MID_Y * TILE + TILE / 2;
  const distToDoor = Math.hypot(doorCX - gameState.myPos.x, doorCY - gameState.myPos.y);
  doorInRange = (distToDoor < 1.5 * TILE) && (inventory.equipped === 'key');

  const offX = -camera.x + W / 2;
  const offY = -camera.y + H / 2;

  if (doorInRange) {
    doorBtn.style.left = (doorCX + offX) + 'px';
    doorBtn.style.top  = (doorCY + offY) + 'px';
    doorBtn.textContent = sharedState.doorLocked ? '🔓 MỞ' : '🔒 KHÓA';
    doorBtn.classList.add('show');
  } else {
    doorBtn.classList.remove('show');
  }

  // Cầu dao
  const brCX = breaker.gx * TILE + TILE / 2;
  const brCY = breaker.gy * TILE + TILE / 2;
  const distToBr = Math.hypot(brCX - gameState.myPos.x, brCY - gameState.myPos.y);
  breakerInRange = (distToBr < 1.5 * TILE);

  if (breakerInRange) {
    breakerBtn.style.left = (brCX + offX) + 'px';
    breakerBtn.style.top  = (brCY + offY) + 'px';
    breakerBtn.textContent = sharedState.breakerOn ? '⚡ TẮT ĐIỆN' : '⚡ BẬT ĐIỆN';
    breakerBtn.classList.add('show');
  } else {
    breakerBtn.classList.remove('show');
  }

  // HUD
  posInfo.textContent = `X:${(gameState.myPos.x/TILE).toFixed(1)} Y:${(gameState.myPos.y/TILE).toFixed(1)}`;
}
// ==================== RAYCAST ====================
function raycast(x0, y0, angle, maxDist) {
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);
  const step = 4;
  let dist = 0;
  while (dist < maxDist) {
    dist += step;
    const x = x0 + dx * dist;
    const y = y0 + dy * dist;
    const gx = Math.floor(x / TILE);
    const gy = Math.floor(y / TILE);
    if (gx < 0 || gx >= MAP_W || gy < 0 || gy >= MAP_H) return dist;
    if (isWall(gx, gy)) return dist;
    if (isFurniture(gx, gy)) return dist;
  }
  return maxDist;
}

// ==================== DRAW: LOCAL PLAYER ====================
function drawPlayer(px, py, dir) {
  const s = player.r * 2;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-s/2, -s/2, s, s);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(-s/2, -s/2, s, s);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-4, -3, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 4, -3, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 1, 5, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.rotate(dir);
  ctx.beginPath();
  ctx.moveTo(s/2 + 2, 0);
  ctx.lineTo(s/2 - 2, -4);
  ctx.lineTo(s/2 - 2, 4);
  ctx.closePath();
  ctx.fillStyle = '#ffdd44';
  ctx.fill();
  ctx.restore();
}

// ==================== DRAW: REMOTE PLAYER ====================
// Remote player: vuông trắng, mặt xanh dương, có tên trên đầu
function drawRemotePlayer(px, py, dir, name) {
  const s = 24;   // nhỏ hơn local chút
  ctx.save();
  ctx.translate(px, py);

  // Thân vuông xanh nhạt
  ctx.fillStyle = '#aaddff';
  ctx.fillRect(-s/2, -s/2, s, s);
  ctx.strokeStyle = '#0066cc';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-s/2, -s/2, s, s);

  // Mắt xanh dương
  ctx.fillStyle = '#003366';
  ctx.beginPath(); ctx.arc(-3.5, -3, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 3.5, -3, 1.6, 0, Math.PI * 2); ctx.fill();

  // Miệng cười
  ctx.beginPath();
  ctx.arc(0, 1, 4, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.strokeStyle = '#003366';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Mũi tên hướng
  ctx.rotate(dir);
  ctx.beginPath();
  ctx.moveTo(s/2 + 2, 0);
  ctx.lineTo(s/2 - 2, -3.5);
  ctx.lineTo(s/2 - 2, 3.5);
  ctx.closePath();
  ctx.fillStyle = '#0066cc';
  ctx.fill();
  ctx.rotate(-dir);

  // Tên trên đầu
  if (name) {
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    // Nền đen mờ
    const textWidth = ctx.measureText(name).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(-textWidth/2 - 4, -s/2 - 16, textWidth + 8, 14);
    // Chữ trắng
    ctx.fillStyle = '#ffffff';
    ctx.fillText(name, 0, -s/2 - 4);
  }

  ctx.restore();
}

    ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = '#8a5a2e';
    ctx.fillRect(px + 5, py + 5, TILE - 10, TILE - 10);
  }
}

// ==================== DRAW: BREAKER ====================
function drawBreaker() {
  const px = breaker.gx * TILE;
  const py = breaker.gy * TILE;
  const cx = px + TILE / 2;
  const cy = py + TILE / 2;

  ctx.save();
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(cx - 12, cy - 10, 24, 20);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - 12, cy - 10, 24, 20);

  const isOn = sharedState.breakerOn;
  const leverY = isOn ? cy - 6 : cy + 6;
  ctx.fillStyle = isOn ? '#44dd44' : '#dd4444';
  ctx.fillRect(cx - 4, leverY - 3, 8, 6);

  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = isOn ? '#88ff88' : '#ff8888';
  ctx.fillText('⚡', cx, cy + 14);

  ctx.restore();
}

// ==================== FLASHLIGHT POLYGON ====================
function buildFlashlightPolygon(offX, offY) {
  const px = gameState.myPos.x + offX;
  const py = gameState.myPos.y + offY;
  const range = 10 * TILE;
  const halfAngle = Math.PI / 6;
  const rays = 32;
  const dir = gameState.myPos.dir;

  const pts = [{ x: px, y: py }];
  for (let i = 0; i <= rays; i++) {
    const a = dir - halfAngle + (2 * halfAngle) * (i / rays);
    const d = raycast(gameState.myPos.x, gameState.myPos.y, a, range);
    pts.push({ x: px + Math.cos(a) * d, y: py + Math.sin(a) * d });
  }
  return { pts, range, px, py };
}

function carveFlashlight(dctx, offX, offY) {
  if (!inventory.flashlightOn || inventory.equipped !== 'flashlight') return;

  const { pts, range, px, py } = buildFlashlightPolygon(offX, offY);

  dctx.save();
  dctx.beginPath();
  dctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) dctx.lineTo(pts[i].x, pts[i].y);
  dctx.closePath();
  dctx.clip();

  const g = dctx.createRadialGradient(px, py, 0, px, py, range);
  g.addColorStop(0,    'rgba(0,0,0,1)');
  g.addColorStop(0.25, 'rgba(0,0,0,0.95)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.75)');
  g.addColorStop(0.8,  'rgba(0,0,0,0.4)');
  g.addColorStop(1,    'rgba(0,0,0,0.05)');
  dctx.fillStyle = g;
  dctx.fillRect(0, 0, W, H);

  dctx.restore();
}
// ==================== RENDER ====================
function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (!gameState.started) return;

  const offX = -camera.x + W / 2;
  const offY = -camera.y + H / 2;

  ctx.save();
  ctx.translate(offX, offY);

  // Background (map + tường + nội thất)
  ctx.drawImage(bgCanvas, 0, 0);

  // Cửa + cầu dao
  drawDoorMid();
  drawBreaker();

  // Items chưa nhặt
  for (const it of ITEMS) {
    if (it.picked) continue;
    ctx.save();
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 300);
    ctx.globalAlpha = pulse;
    ctx.fillText(it.icon, it.x, it.y);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = `rgba(255,220,100,${pulse * 0.8})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(it.x, it.y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Viền rìa map
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

  // Remote players (vẽ trước local để local luôn trên)
  for (const [id, p] of gameState.players.entries()) {
    const dx = p.displayX !== undefined ? p.displayX : p.x;
    const dy = p.displayY !== undefined ? p.displayY : p.y;
    drawRemotePlayer(dx, dy, p.dir, p.name || id);
  }

  // Local player
  drawPlayer(gameState.myPos.x, gameState.myPos.y, gameState.myPos.dir);
  drawEquippedItem(gameState.myPos.x, gameState.myPos.y, gameState.myPos.dir);

  ctx.restore();

  // ============ OVERLAY TỐI ============
  const darkLayer = document.createElement('canvas');
  darkLayer.width = W;
  darkLayer.height = H;
  const dctx = darkLayer.getContext('2d');

  const outsideAlpha = 0.96;
  dctx.fillStyle = `rgba(0,0,0,${outsideAlpha})`;
  dctx.fillRect(0, 0, W, H);

  dctx.globalCompositeOperation = 'destination-out';

  // Vùng sáng nhà
  const housePx = (HOUSE.x * TILE) + offX;
  const housePy = (HOUSE.y * TILE) + offY;
  const housePw = HOUSE.w * TILE;
  const housePh = HOUSE.h * TILE;
  const houseCx = housePx + housePw / 2;
  const houseCy = housePy + housePh / 2;
  const houseRadius = Math.hypot(housePw, housePh) / 2 + 30;

  const houseLight = power.dimFactor;

  if (houseLight > 0.01) {
    const grad = dctx.createRadialGradient(
      houseCx, houseCy, Math.min(housePw, housePh) * 0.3,
      houseCx, houseCy, houseRadius
    );
    grad.addColorStop(0,    `rgba(0,0,0,${houseLight})`);
    grad.addColorStop(0.5,  `rgba(0,0,0,${houseLight * 0.85})`);
    grad.addColorStop(0.8,  `rgba(0,0,0,${houseLight * 0.4})`);
    grad.addColorStop(1,    'rgba(0,0,0,0)');
    dctx.fillStyle = grad;
    dctx.beginPath();
    dctx.arc(houseCx, houseCy, houseRadius, 0, Math.PI * 2);
    dctx.fill();

    for (const L of lights) {
      const lx = L.x + offX, ly = L.y + offY;
      const intensity = L.intensity * houseLight;
      const g2 = dctx.createRadialGradient(lx, ly, 0, lx, ly, L.radius);
      g2.addColorStop(0,   `rgba(0,0,0,${intensity})`);
      g2.addColorStop(0.6, `rgba(0,0,0,${intensity * 0.5})`);
      g2.addColorStop(1,   'rgba(0,0,0,0)');
      dctx.fillStyle = g2;
      dctx.beginPath();
      dctx.arc(lx, ly, L.radius, 0, Math.PI * 2);
      dctx.fill();
    }
  }

  // Vùng sáng chồi
  const shedPx = (shedX * TILE) + offX;
  const shedPy = (shedY * TILE) + offY;
  const shedPw = SHED.w * TILE;
  const shedPh = SHED.h * TILE;
  const shedCx = shedPx + shedPw / 2;
  const shedCy = shedPy + shedPh / 2;
  {
    const grad = dctx.createRadialGradient(shedCx, shedCy, 0, shedCx, shedCy, 60);
    grad.addColorStop(0,   'rgba(0,0,0,0.35)');
    grad.addColorStop(1,   'rgba(0,0,0,0)');
    dctx.fillStyle = grad;
    dctx.beginPath();
    dctx.arc(shedCx, shedCy, 60, 0, Math.PI * 2);
    dctx.fill();
  }

  // Đèn pin — chỉ cho local player (chưa sync cho remote ở v0.9a)
  carveFlashlight(dctx, offX, offY);

  ctx.drawImage(darkLayer, 0, 0);

  // ============ ÁNH SÁNG VÀNG ============
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  if (power.dimFactor > 0.01) {
    for (const L of lights) {
      const lx = L.x + offX, ly = L.y + offY;
      const d = power.dimFactor;
      const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, L.radius * 0.9);
      g.addColorStop(0,    `rgba(255,220,140,${0.45 * d})`);
      g.addColorStop(0.5,  `rgba(255,200,120,${0.2 * d})`);
      g.addColorStop(1,    'rgba(255,220,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(lx, ly, L.radius * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (inventory.flashlightOn && inventory.equipped === 'flashlight') {
    const { pts, range, px, py } = buildFlashlightPolygon(offX, offY);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.clip();
    const g = ctx.createRadialGradient(px, py, 0, px, py, range);
    g.addColorStop(0,   'rgba(255,245,200,0.5)');
    g.addColorStop(0.4, 'rgba(255,240,180,0.25)');
    g.addColorStop(1,   'rgba(255,240,180,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  ctx.restore();

  // ============ VIGNETTE ============
  const vig = ctx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.35,
    W / 2, H / 2, Math.max(W, H) * 0.75
  );
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

// ==================== LOOP ====================
let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 100) dt = 100;
  update(dt);
  render();
}
loop();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ==================== INIT ====================
updateInventoryUI();
</script>
</body>
</html>
